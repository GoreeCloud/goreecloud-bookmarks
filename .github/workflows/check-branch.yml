name: Check pull request source branch

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - edited

permissions:
  contents: read

jobs:
  check-branches:
    if: github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate GoreeCloud source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          case "$HEAD_REF" in
            dev|feature/*|fix/*|security/*|upstream-sync/*|release/*|agent/*|test/*|docs/*)
              echo "Source branch '$HEAD_REF' follows the GoreeCloud branch model."
              ;;
            *)
              echo "Pull requests to main must use dev or an approved GoreeCloud branch prefix:" >&2
              echo "feature/, fix/, security/, upstream-sync/, release/, agent/, test/, or docs/." >&2
              exit 1
              ;;
          esac
