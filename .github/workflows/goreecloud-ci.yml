name: GoreeCloud Bookmarks CI

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "security/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://goreecloud_ci:goreecloud_ci@127.0.0.1:5432/goreecloud_ci
  NEXTAUTH_SECRET: goreecloud-ci-build-only-secret
  NEXTAUTH_URL: http://localhost:3000/api/v1/auth
  GOREECLOUD_SKIP_PLAYWRIGHT_BROWSER_INSTALL: "1"

jobs:
  build:
    name: Test and build web application
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: goreecloud_ci
          POSTGRES_PASSWORD: goreecloud_ci
          POSTGRES_DB: goreecloud_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable pinned Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Generate Prisma client
        run: yarn prisma:generate

      - name: Apply database migrations
        run: yarn prisma:deploy

      - name: Run unit tests
        run: yarn test --run

      - name: Build web application
        run: yarn web:build
