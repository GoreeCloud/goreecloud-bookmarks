openapi: 3.2.1
info:
  title: GoreeCloud Bookmarks API
  version: 0.1.0-development
  summary: Planned v1 application API contract for GoreeCloud Bookmarks.
  description: >-
    Development-stage machine-readable contract. Health and readiness are implemented;
    the remaining /api/v1 resource surface and schemas are planned and are not asserted
    as deployed, reachable, accepted, or production-ready.
x-goreecloud-status: planned
x-goreecloud-lifecycle: development
x-goreecloud-api-major: v1
security:
  - bearerAuth: []
tags:
  - name: Bookmarks
  - name: Collections
  - name: Tags
  - name: Notes
  - name: Highlights
  - name: Archives
  - name: Reminders
  - name: Sharing
  - name: Automation
  - name: LinkHealth
  - name: SavedSearches
  - name: Sync
  - name: Health
paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Return bounded service-health state.
      security: []
      responses:
        '200':
          description: Health response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'
  /api/v1/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Return bounded readiness state.
      security: []
      responses:
        '200':
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
  /api/v1/bookmarks:
    get:
      tags: [Bookmarks]
      operationId: listBookmarks
      summary: List authorized bookmarks.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: collectionId
          schema: { type: string }
        - in: query
          name: tagId
          schema: { type: string }
        - in: query
          name: readState
          schema: { type: string }
        - in: query
          name: query
          schema: { type: string }
      responses:
        '200':
          description: Bookmark page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookmarkList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [Bookmarks]
      operationId: createBookmark
      summary: Create a bookmark immediately before optional enrichment.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkCreate'
      responses:
        '201':
          description: Bookmark created.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/bookmarks/{bookmarkId}:
    parameters:
      - $ref: '#/components/parameters/BookmarkId'
    get:
      tags: [Bookmarks]
      operationId: getBookmark
      responses:
        '200':
          description: Bookmark.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [Bookmarks]
      operationId: updateBookmark
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookmarkUpdate'
      responses:
        '200':
          description: Updated bookmark.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Bookmark'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [Bookmarks]
      operationId: deleteBookmark
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204':
          description: Bookmark tombstoned/deleted from normal views.
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'
