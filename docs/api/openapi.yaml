            lastTriggeredAt: { type: [string, 'null'], format: date-time }
    ReminderCreate:
      type: object
      required: [bookmarkId, dueAt]
      properties:
        bookmarkId: { type: string }
        dueAt: { type: string, format: date-time }
        recurrence: { type: [string, 'null'], maxLength: 2048 }
    ReminderUpdate:
      type: object
      properties:
        dueAt: { type: string, format: date-time }
        recurrence: { type: [string, 'null'], maxLength: 2048 }
        status: { type: string, enum: [scheduled, triggered, completed, cancelled] }
    ReminderList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Reminder' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Share:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [resourceType, resourceId, accessMode]
          properties:
            resourceType: { type: string, enum: [bookmark, collection, archive] }
            resourceId: { type: string }
            accessMode: { type: string, enum: [specific-people, shared-group, anyone-with-link, public] }
            expiresAt: { type: [string, 'null'], format: date-time }
            revokedAt: { type: [string, 'null'], format: date-time }
    ShareCreate:
      type: object
      required: [resourceType, resourceId, accessMode]
      properties:
        resourceType: { type: string, enum: [bookmark, collection, archive] }
        resourceId: { type: string }
        accessMode: { type: string, enum: [specific-people, shared-group, anyone-with-link, public] }
        expiresAt: { type: [string, 'null'], format: date-time }
    ShareUpdate:
      type: object
      properties:
        accessMode: { type: string, enum: [specific-people, shared-group, anyone-with-link, public] }
        expiresAt: { type: [string, 'null'], format: date-time }
    ShareList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Share' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Permission:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [shareId, principalType, role]
          properties:
            shareId: { type: string }
            principalType: { type: string, enum: [user, group, link, public] }
            principalId: { type: [string, 'null'] }
            role: { type: string, enum: [viewer, contributor, editor, manager, owner] }
            revokedAt: { type: [string, 'null'], format: date-time }
    PermissionCreate:
      type: object
      required: [shareId, principalType, role]
      properties:
        shareId: { type: string }
        principalType: { type: string, enum: [user, group, link, public] }
        principalId: { type: [string, 'null'] }
        role: { type: string, enum: [viewer, contributor, editor, manager, owner] }
    PermissionUpdate:
      type: object
      properties:
        role: { type: string, enum: [viewer, contributor, editor, manager, owner] }
    PermissionList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Permission' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    RuleClause:
      type: object
      required: [type, config]
      properties:
        type: { type: string, minLength: 1, maxLength: 256 }
        config: { type: object, additionalProperties: true }
    AutomationRule:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [name, enabled, conditions, actions]
          properties:
            name: { type: string, minLength: 1, maxLength: 512 }
            enabled: { type: boolean }
            conditions: { type: array, items: { $ref: '#/components/schemas/RuleClause' } }
            actions: { type: array, items: { $ref: '#/components/schemas/RuleClause' } }
    AutomationRuleCreate:
      type: object
      required: [name, conditions, actions]
      properties:
        name: { type: string, minLength: 1, maxLength: 512 }
        enabled: { type: boolean, default: true }
        conditions: { type: array, items: { $ref: '#/components/schemas/RuleClause' } }
        actions: { type: array, items: { $ref: '#/components/schemas/RuleClause' } }
    AutomationRuleUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 512 }
        enabled: { type: boolean }
        conditions: { type: array, items: { $ref: '#/components/schemas/RuleClause' } }
        actions: { type: array, items: { $ref: '#/components/schemas/RuleClause' } }
    AutomationRuleList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AutomationRule' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    LinkHealthRecord:
      type: object
      required: [id, bookmarkId, state, checkedAt]
      properties:
        id: { type: string }
        bookmarkId: { type: string }
        state: { type: string, enum: [healthy, redirected, changed, temporarily-unavailable, permanently-unavailable, blocked, unknown] }
        checkedAt: { type: string, format: date-time }
        httpStatus: { type: [integer, 'null'], minimum: 100, maximum: 599 }
        redirectTarget: { type: [string, 'null'], format: uri }
        lastHealthyAt: { type: [string, 'null'], format: date-time }
