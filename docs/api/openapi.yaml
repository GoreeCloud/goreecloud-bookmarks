        '200':
          description: Saved-search page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearchList'
        default:
          $ref: '#/components/responses/Error'
    post:
      tags: [SavedSearches]
      operationId: createSavedSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedSearchCreate'
      responses:
        '201':
          description: Saved search created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearch'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/saved-searches/{savedSearchId}:
    parameters:
      - $ref: '#/components/parameters/SavedSearchId'
    get:
      tags: [SavedSearches]
      operationId: getSavedSearch
      responses:
        '200':
          description: Saved search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearch'
        default:
          $ref: '#/components/responses/Error'
    patch:
      tags: [SavedSearches]
      operationId: updateSavedSearch
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedSearchUpdate'
      responses:
        '200':
          description: Updated saved search.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedSearch'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'
    delete:
      tags: [SavedSearches]
      operationId: deleteSavedSearch
