        '412':
          $ref: '#/components/responses/PreconditionFailed'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/sync/changes:
    get:
      tags: [Sync]
      operationId: getSyncChanges
      parameters:
        - in: query
          name: cursor
          schema: { type: string }
          description: Opaque synchronization cursor; omitted for an initial synchronization window.
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
      responses:
        '200':
          description: Ordered synchronization changes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncChangePage'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/sync/mutations:
    post:
      tags: [Sync]
      operationId: submitSyncMutations
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncMutationBatch'
      responses:
        '200':
          description: Per-mutation outcomes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncMutationBatchResult'
        default:
          $ref: '#/components/responses/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >-
        Access token accepted by GoreeCloud Bookmarks. GoreeCloud Identity/OIDC/OAuth is
        the intended platform integration where implemented; this Concept contract does
        not invent an identity-provider URL or token endpoint.
  parameters:
    Cursor:
      in: query
      name: cursor
      required: false
      schema: { type: string }
      description: Opaque cursor returned by the preceding page.
    Limit:
      in: query
      name: limit
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    IfMatch:
      in: header
      name: If-Match
      required: true
      schema: { type: string }
      description: Entity tag/revision precondition for overwrite-sensitive mutations.
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 200 }
    BookmarkId: { in: path, name: bookmarkId, required: true, schema: { type: string } }
    CollectionId: { in: path, name: collectionId, required: true, schema: { type: string } }
    TagId: { in: path, name: tagId, required: true, schema: { type: string } }
    NoteId: { in: path, name: noteId, required: true, schema: { type: string } }
    HighlightId: { in: path, name: highlightId, required: true, schema: { type: string } }
    ArchiveId: { in: path, name: archiveId, required: true, schema: { type: string } }
    ArchiveVersionId: { in: path, name: archiveVersionId, required: true, schema: { type: string } }
    ReminderId: { in: path, name: reminderId, required: true, schema: { type: string } }
    ShareId: { in: path, name: shareId, required: true, schema: { type: string } }
    PermissionId: { in: path, name: permissionId, required: true, schema: { type: string } }
    AutomationRuleId: { in: path, name: automationRuleId, required: true, schema: { type: string } }
    LinkHealthRecordId: { in: path, name: linkHealthRecordId, required: true, schema: { type: string } }
    SavedSearchId: { in: path, name: savedSearchId, required: true, schema: { type: string } }
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PreconditionFailed:
      description: Current resource revision does not satisfy the supplied precondition.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ResourceBase:
      type: object
      required: [id, revision, createdAt, updatedAt]
      properties:
        id: { type: string, minLength: 1 }
        revision: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, 'null'], format: date-time }
    PageInfo:
      type: object
      required: [hasMore]
      properties:
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
    PrivacyLevel:
      type: string
      enum: [normal, sensitive, private-vault, shared]
    Bookmark:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [url, title, favorite, pinned, readState, privacyLevel]
          properties:
            url: { type: string, format: uri, maxLength: 8192 }
            originalUrl: { type: [string, 'null'], format: uri, maxLength: 8192 }
            title: { type: string, maxLength: 4096 }
            description: { type: [string, 'null'], maxLength: 16384 }
            contentType: { type: [string, 'null'], maxLength: 255 }
            source: { type: [string, 'null'], maxLength: 1024 }
            author: { type: [string, 'null'], maxLength: 2048 }
            language: { type: [string, 'null'], maxLength: 64 }
            publishedAt: { type: [string, 'null'], format: date-time }
            lastVisitedAt: { type: [string, 'null'], format: date-time }
            favorite: { type: boolean }
            pinned: { type: boolean }
            readState: { type: string, enum: [unread, reading, completed, archived] }
            readingProgress: { type: [number, 'null'], minimum: 0, maximum: 1 }
            privacyLevel: { $ref: '#/components/schemas/PrivacyLevel' }
            collectionIds:
              type: array
              items: { type: string }
              uniqueItems: true
            tagIds:
              type: array
              items: { type: string }
              uniqueItems: true
            archiveStatus: { type: [string, 'null'] }
            offlineRequested: { type: boolean, default: false }
    BookmarkCreate:
      type: object
      required: [url]
      properties:
        url: { type: string, format: uri, maxLength: 8192 }
        title: { type: [string, 'null'], maxLength: 4096 }
        description: { type: [string, 'null'], maxLength: 16384 }
        collectionIds: { type: array, items: { type: string }, uniqueItems: true }
        tagIds: { type: array, items: { type: string }, uniqueItems: true }
        favorite: { type: boolean, default: false }
        readState: { type: string, enum: [unread, reading, completed, archived], default: unread }
        privacyLevel: { $ref: '#/components/schemas/PrivacyLevel' }
        archiveMode: { type: [string, 'null'], enum: [metadata, readable, visual, complete, null] }
        offlineRequested: { type: boolean, default: false }
    BookmarkUpdate:
      type: object
      properties:
        url: { type: string, format: uri, maxLength: 8192 }
        title: { type: string, maxLength: 4096 }
        description: { type: [string, 'null'], maxLength: 16384 }
        collectionIds: { type: array, items: { type: string }, uniqueItems: true }
        tagIds: { type: array, items: { type: string }, uniqueItems: true }
        favorite: { type: boolean }
        pinned: { type: boolean }
        readState: { type: string, enum: [unread, reading, completed, archived] }
        readingProgress: { type: [number, 'null'], minimum: 0, maximum: 1 }
        privacyLevel: { $ref: '#/components/schemas/PrivacyLevel' }
        offlineRequested: { type: boolean }
    BookmarkList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Bookmark' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Collection:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 512 }
            description: { type: [string, 'null'], maxLength: 8192 }
            parentId: { type: [string, 'null'] }
            icon: { type: [string, 'null'], maxLength: 512 }
            coverRef: { type: [string, 'null'] }
            sortOrder: { type: integer, minimum: 0, default: 0 }
            defaultArchiveMode: { type: [string, 'null'], enum: [metadata, readable, visual, complete, null] }
            defaultPrivacyLevel: { oneOf: [{ $ref: '#/components/schemas/PrivacyLevel' }, { type: 'null' }] }
            defaultOffline: { type: [boolean, 'null'] }
    CollectionCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 512 }
        description: { type: [string, 'null'], maxLength: 8192 }
        parentId: { type: [string, 'null'] }
        icon: { type: [string, 'null'], maxLength: 512 }
        sortOrder: { type: integer, minimum: 0, default: 0 }
    CollectionUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 512 }
        description: { type: [string, 'null'], maxLength: 8192 }
        parentId: { type: [string, 'null'] }
        icon: { type: [string, 'null'], maxLength: 512 }
        sortOrder: { type: integer, minimum: 0 }
    CollectionList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Collection' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Tag:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [name]
          properties:
            name: { type: string, minLength: 1, maxLength: 256 }
            color: { type: [string, 'null'], maxLength: 64 }
            description: { type: [string, 'null'], maxLength: 4096 }
            aliases: { type: array, items: { type: string, maxLength: 256 }, uniqueItems: true }
    TagCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        color: { type: [string, 'null'], maxLength: 64 }
        description: { type: [string, 'null'], maxLength: 4096 }
        aliases: { type: array, items: { type: string, maxLength: 256 }, uniqueItems: true }
    TagUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 256 }
        color: { type: [string, 'null'], maxLength: 64 }
        description: { type: [string, 'null'], maxLength: 4096 }
        aliases: { type: array, items: { type: string, maxLength: 256 }, uniqueItems: true }
    TagList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Tag' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Note:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [content]
          properties:
            bookmarkId: { type: [string, 'null'] }
            title: { type: [string, 'null'], maxLength: 1024 }
            content: { type: string, maxLength: 1048576 }
            contentFormat: { type: string, enum: [markdown, plain-text], default: markdown }
            privacyLevel: { $ref: '#/components/schemas/PrivacyLevel' }
    NoteCreate:
      type: object
      required: [content]
      properties:
        bookmarkId: { type: [string, 'null'] }
        title: { type: [string, 'null'], maxLength: 1024 }
        content: { type: string, maxLength: 1048576 }
        contentFormat: { type: string, enum: [markdown, plain-text], default: markdown }
        privacyLevel: { $ref: '#/components/schemas/PrivacyLevel' }
    NoteUpdate:
      type: object
      properties:
        title: { type: [string, 'null'], maxLength: 1024 }
        content: { type: string, maxLength: 1048576 }
        contentFormat: { type: string, enum: [markdown, plain-text] }
        privacyLevel: { $ref: '#/components/schemas/PrivacyLevel' }
    NoteList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Note' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Highlight:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [bookmarkId, selectedText]
          properties:
            bookmarkId: { type: string }
            selectedText: { type: string, maxLength: 262144 }
            note: { type: [string, 'null'], maxLength: 262144 }
            sourceAnchor:
              type: [object, 'null']
              additionalProperties: true
            label: { type: [string, 'null'], maxLength: 256 }
            color: { type: [string, 'null'], maxLength: 64 }
    HighlightCreate:
      type: object
      required: [bookmarkId, selectedText]
      properties:
        bookmarkId: { type: string }
        selectedText: { type: string, maxLength: 262144 }
        note: { type: [string, 'null'], maxLength: 262144 }
        sourceAnchor: { type: [object, 'null'], additionalProperties: true }
        label: { type: [string, 'null'], maxLength: 256 }
        color: { type: [string, 'null'], maxLength: 64 }
    HighlightUpdate:
      type: object
      properties:
        note: { type: [string, 'null'], maxLength: 262144 }
        sourceAnchor: { type: [object, 'null'], additionalProperties: true }
        label: { type: [string, 'null'], maxLength: 256 }
        color: { type: [string, 'null'], maxLength: 64 }
    HighlightList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Highlight' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Archive:
      allOf:
        - $ref: '#/components/schemas/ResourceBase'
        - type: object
          required: [bookmarkId, requestedMode, status]
          properties:
            bookmarkId: { type: string }
            requestedMode: { type: string, enum: [metadata, readable, visual, complete] }
            status: { type: string, enum: [pending, running, succeeded, failed, cancelled] }
            latestVersionId: { type: [string, 'null'] }
            lastCapturedAt: { type: [string, 'null'], format: date-time }
            warning: { type: [string, 'null'] }
    ArchiveCreate:
      type: object
      required: [bookmarkId, requestedMode]
      properties:
        bookmarkId: { type: string }
        requestedMode: { type: string, enum: [metadata, readable, visual, complete] }
    ArchiveUpdate:
      type: object
      properties:
        requestedMode: { type: string, enum: [metadata, readable, visual, complete] }
    ArchiveList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/Archive' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    ArchiveObjectRef:
      type: object
      required: [kind, digestAlgorithm, digest, sizeBytes]
      properties:
        kind: { type: string, enum: [warc, readable, visual, preview, other] }
        mediaType: { type: [string, 'null'] }
        formatVersion: { type: [string, 'null'] }
        digestAlgorithm: { type: string, enum: [sha256] }
        digest: { type: string }
        sizeBytes: { type: integer, minimum: 0 }
        integrityState: { type: string, enum: [unknown, verified, failed] }
    ArchiveVersion:
      type: object
      required: [id, archiveId, bookmarkId, capturedAt, status, objects]
      properties:
        id: { type: string }
        archiveId: { type: string }
        bookmarkId: { type: string }
        capturedAt: { type: string, format: date-time }
        sourceUrl: { type: [string, 'null'], format: uri }
        captureMode: { type: string, enum: [metadata, readable, visual, complete] }
        status: { type: string, enum: [succeeded, failed, partial] }
        objects:
          type: array
          items: { $ref: '#/components/schemas/ArchiveObjectRef' }
        warning: { type: [string, 'null'] }
    ArchiveVersionList:
      type: object
      required: [items, page]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ArchiveVersion' } }
        page: { $ref: '#/components/schemas/PageInfo' }
    Reminder:
