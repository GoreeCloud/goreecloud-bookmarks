      tags: [LinkHealth]
      operationId: listLinkHealth
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - in: query
          name: bookmarkId
          schema: { type: string }
      responses:
        '200':
          description: Link-health page.
          content:
