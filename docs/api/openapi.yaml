              $ref: '#/components/schemas/LinkHealthCheckRequest'
      responses:
        '202':
          description: Link-health check accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LinkHealthRecord'
        default:
          $ref: '#/components/responses/Error'
  /api/v1/link-health/{linkHealthRecordId}:
