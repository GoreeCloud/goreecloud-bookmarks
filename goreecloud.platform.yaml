health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - "Bookmark metadata, collections, tags, notes, highlights, sharing configuration, saved searches, rules, and other critical user state require recoverable backup."
      - "Preserved webpage data may use a separate scalable backup lifecycle, but its recovery scope must be explicit."
  restore:
    required: true
    requirements:
      - "Restore procedures must be tested and must distinguish bookmark metadata recovery from potentially larger archived-content recovery."
  export:
    required: true
    requirements:
      - "Users require portable export of bookmark metadata and supported selected/account scopes."
      - "Where permitted, preserved content and archive metadata should be exportable without making Bookmarks the only usable reader of user-owned data."
  portability:
    required: true
    requirements:
      - "The product must support migration away from GoreeCloud Bookmarks without unnecessary lock-in."
      - "Standard browser-compatible and structured machine-readable forms should be supported where applicable."

external_dependencies: []

compatibility:
