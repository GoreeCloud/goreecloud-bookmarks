  wardveil_security:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "Security integration is required for capture, archive, sync, import/export, sharing, and service boundaries, but no Bookmarks-specific Wardveil runtime integration or acceptance evidence is verified."
  everkeep:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "Backup, restore, archive preservation, migration, export, and portability are planned, but no Bookmarks-specific Everkeep runtime integration or acceptance evidence is verified."
  glaze_ui:
    result: applicable-blocked
