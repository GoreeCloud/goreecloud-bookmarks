# GoreeCloud Bookmarks Platform Contract declaration
# Contract declarations describe repository state; they do not prove acceptance or production readiness.

schema_version: "0.4"

component:
  type: application
  id: goreecloud-bookmarks
  product_name: GoreeCloud Bookmarks
  repository: GoreeCloud/goreecloud-bookmarks

lifecycle: experimental
version: "0.1.0"

supported_platforms:
  - web
  - desktop
  - mobile
  - goreecloud-browser

api:
  versions:
    - "v1"
  endpoints:
    - name: health
      url: "/api/v1/health"
      purpose: "Return bounded process-health state for the experimental Bookmarks service foundation."
    - name: readiness
      url: "/api/v1/ready"
      purpose: "Return fail-closed readiness state; currently non-ready until the required Bookmarks data layer exists."

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "Administrative and operational integration is planned, but the experimental health/readiness surface is not GoreeCloud Manager acceptance evidence."
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "The current experimental service does not process bookmark content, but no Bookmarks-specific Privacy Shield runtime integration or acceptance evidence is verified."
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "The experimental foundation has bounded service hardening and tests, but no Bookmarks-specific Wardveil runtime integration or acceptance evidence is verified."
  everkeep:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "No Bookmarks data layer exists yet and no Bookmarks-specific Everkeep backup, restore, migration, portability, or acceptance evidence is verified."
  glaze_ui:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "User-facing Browser, web, desktop, and mobile experiences remain unimplemented; the current Stable Glaze UI consumer target is 1.5.1, but no Bookmarks-specific implementation or acceptance evidence exists."
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "No Bookmarks-specific GoreeCloud Mesh capability discovery, dependency, event, or acceptance implementation is verified."
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "Authentication, accounts, devices, sharing, collaboration, and service authorization remain unimplemented; no Bookmarks-specific GoreeCloud Identity acceptance evidence is verified."
  policy:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "No Bookmarks-specific GoreeCloud Policy runtime integration or acceptance evidence is verified."
  observability:
    result: applicable-blocked
    version: null
    evidence: []
    notes: "Bounded health/readiness endpoints exist, but no Bookmarks-specific GoreeCloud Observability integration or acceptance evidence is verified."

health:
  health_endpoint: "/api/v1/health"
  readiness_endpoint: "/api/v1/ready"

continuity:
  backup:
    required: true
    requirements:
      - "Bookmark metadata, collections, tags, notes, highlights, sharing configuration, saved searches, rules, and other critical user state require recoverable backup when implemented."
      - "Preserved webpage data may use a separate scalable backup lifecycle, but its recovery scope must be explicit."
  restore:
    required: true
    requirements:
      - "Restore procedures must be tested and must distinguish bookmark metadata recovery from potentially larger archived-content recovery."
  export:
    required: true
    requirements:
      - "Users require portable export of bookmark metadata and supported selected/account scopes when the data layer is implemented."
      - "Where permitted, preserved content and archive metadata should be exportable without making Bookmarks the only usable reader of user-owned data."
  portability:
    required: true
    requirements:
      - "The product must support migration away from GoreeCloud Bookmarks without unnecessary lock-in."
      - "Standard browser-compatible and structured machine-readable forms should be supported where applicable."

external_dependencies: []

compatibility:
  platform_contract: "0.4"
  glaze_ui_required: "1.5.1"
  requires: []
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: unverified
  validated_at: null
  evidence: []
  blockers:
    - "Only a minimal Experimental Go service foundation is implemented; bookmark persistence, authentication, authorization, search, synchronization, archival, clients, and end-user workflows remain unimplemented."
    - "Readiness intentionally returns non-ready because the required Bookmarks data layer is not configured."
    - "No Bookmarks-specific acceptance evidence exists for any of the nine Integral Platform Systems."
    - "No supported deployment, release artifact, production-readiness evidence, Release Candidate acceptance, or Stable qualification exists."
